<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Liquidity Hunter Chart</title>

    <script src="js/lightweight-charts.standalone.development.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #131722;
        }

        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="chart"></div>

<script>

const chart = LightweightCharts.createChart(
    document.getElementById("chart"),
    {
        width: window.innerWidth,
        height: window.innerHeight,

        layout: {
            background: {
                color: "#131722"
            },
            textColor: "#d1d4dc"
        },

        grid: {
            vertLines: {
                color: "#2a2e39"
            },
            horzLines: {
                color: "#2a2e39"
            }
        },

        rightPriceScale: {
            borderColor: "#485c7b"
        },

        timeScale: {
            borderColor: "#485c7b",
            timeVisible: true
        }
    }
);

// ===== v5 API =====
const candleSeries = chart.addSeries(
    LightweightCharts.CandlestickSeries,
    {}
);

candleSeries.setData([
    {
        time: "2026-07-20",
        open: 100,
        high: 110,
        low: 95,
        close: 108
    },
    {
        time: "2026-07-21",
        open: 108,
        high: 118,
        low: 104,
        close: 116
    }
]);

window.addEventListener("resize", () => {
    chart.resize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
